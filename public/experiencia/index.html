<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GENIDEIA — Experiencia aplicada</title></head>
<body style="margin:0;background:#020817;color:#f7fbff;font-family:system-ui;display:grid;place-items:center;min-height:100vh">Cargando portfolio…
<script>
(async()=>{
  const response=await fetch('/experiencia/base.html',{cache:'no-cache'});
  if(!response.ok)throw new Error('No se pudo cargar el portfolio');
  let html=await response.text();
  html=html.replace('</body>','<script src="/experiencia/video-overrides.js"><\/script></body>');
  document.open();document.write(html);document.close();
})().catch(error=>{document.body.innerHTML='<div style="padding:32px">No se pudo cargar el portfolio.</div>';console.error(error)});
</script>
</body>
</html>
