<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM · GENIDEIA</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0F1A">
<link rel="icon" href="/crm/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Poppins:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/crm/crm.css?v=7">
</head>
<body class="px crm">
<div class="px-amb" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="px-grain" aria-hidden="true"></div>

<header class="px-top">
  <a class="px-brand" href="/crm/"><img src="/crm/logo-crm.png" alt="" width="38" height="38"><span><b>GENIDEIA <em>CRM</em></b><small>Prospección y conversaciones</small></span></a>
  <nav class="vtabs" id="tabs" aria-label="Vistas">
    <button data-view="hoy">Hoy</button>
    <button data-view="conversaciones">Conversaciones</button>
    <button data-view="pipeline">Pipeline</button>
    <button data-view="empresas">Empresas</button>
    <button data-view="nichos">Nichos</button>
    <button data-view="tandas">Tandas</button>
    <button data-view="metricas">Métricas</button>
    <button data-view="mensajes">Mensajes</button>
    <button data-view="instagram">Instagram</button>
    <button data-view="reuniones">Reuniones</button>
    <button data-view="comercial">Comercial</button>
    <button data-view="cartera">Cartera</button>
    <button data-view="agustin">Agustín Alvez</button>
    <button data-view="revision">Revisión <span class="cnt" id="revCnt"></span></button>
  </nav>
  <div class="top-act">
    <span class="sync" id="sync"><i></i><span>Conectando</span></span>
    <button class="px-btn g sm" id="btnDatos" aria-haspopup="true">Datos</button>
    <button class="px-btn p sm" id="btnNueva">Nueva empresa</button>
  </div>
</header>

<main class="px-shell wrap" id="app">
  <section class="view" id="v-hoy"></section>
  <section class="view" id="v-conversaciones"></section>
  <section class="view" id="v-pipeline"></section>
  <section class="view" id="v-empresas"></section>
  <section class="view" id="v-nichos"></section>
  <section class="view" id="v-tandas"></section>
  <section class="view" id="v-metricas"></section>
  <section class="view" id="v-mensajes"></section>
  <section class="view" id="v-instagram"></section>
  <section class="view" id="v-reuniones"></section>
  <section class="view" id="v-comercial"></section>
  <section class="view" id="v-cartera"></section>
  <section class="view" id="v-agustin"></section>
  <section class="view" id="v-revision"></section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="ficha" id="ficha" aria-hidden="true" role="dialog" aria-label="Ficha de empresa"></aside>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"></div>

<div class="menu" id="menu" hidden>
  <button data-act="exportar">Exportar todo (JSON con relaciones)</button>
  <label>Importar archivo (JSON genideia-crm/2)<input type="file" accept=".json,application/json" id="fileImport" hidden></label>
  <button data-act="formato">Formato de importación y API</button>
  <button data-act="logout">Cerrar sesión</button>
  <p>Los datos viven en Supabase y solo los ven los administradores del CRM.</p>
</div>

<div class="login" id="login" hidden>
  <form class="card login-card" id="loginForm">
    <img src="/crm/logo-crm.png" alt="" width="54" height="54">
    <p class="px-eb">CRM GENIDEIA</p>
    <h1>Ingresá para ver las conversaciones</h1>
    <label class="f"><span>Email</span><input class="in" id="lgEmail" type="email" autocomplete="username" required></label>
    <label class="f"><span>Contraseña</span><input class="in" id="lgPass" type="password" autocomplete="current-password" required></label>
    <button class="px-btn p" type="submit">Entrar</button>
    <p class="lg-msg" id="loginMsg" role="alert"></p>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="/crm/medicion.js?v=8"></script>
<script src="/crm/panel-medicion.js?v=7"></script>
<script src="/crm/multicanal.js?v=2"></script>
<script src="/crm/crm.js?v=9"></script>
</body>
</html>
