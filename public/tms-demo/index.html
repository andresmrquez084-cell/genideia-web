ton class="btn secondary" onclick="go('client')">Seguimiento del cliente</button></div></section><section class="steps">${st.map((x,i)=>`<article class="step"><div class="num">${i+1}</div><h3>${x[0]}</h3><p>${x[1]}</p><button class="btn secondary" onclick="go('${x[2]}')">Abrir</button></article>`).join('')}</section></main>`}function side(a,c){return top()+`<div class="layout"><aside class="side"><button onclick="go('admin')">⌂ Solicitudes</button><button onclick="go('trip')">↗ Viaje GEN-2407</button><button onclick="go('history')">◷ Historial</button><button onclick="go('driver')">♙ Ver como conductor</button><button onclick="go('client')">⌖ Ver como cliente</button></aside><main class="main">${c}</main></div>`}function admin(){return side('admin',`<div class="head"><div><h1>Solicitud SOL-0235</h1><p class="muted">De la necesidad inicial a una operación planificada.</p></div><span class="pill green">Aprobada</span></div><section class="card"><div class="ch"><h3>Cerámica Mercedes</h3><button class="btn primary" onclick="go('trip')">Abrir GEN-2407 →</button></div><div class="cb"><div class="fields"><div class="f"><small>Origen</small>Mercedes — Fábrica ruta 2 km 275</div><div class="f"><small>Destino</small>Montevideo — Corralón Cerro</div><div class="f"><small>Carga</small>Cerámicas en pallets</div><div class="f"><small>Peso</small>7.200 kg</div></div><div class="flow"><span>Solicitud recibida</span>→<span>Evaluación</span>→<span>Aprobación</span>→<span>Viaje creado</span>→<span>Conductor + vehículo</span></div><div class="ok">✓ SOL-0235 generó GEN-2407 y quedó vinculada a toda su trazabilidad.</div></div></section>`)}function trip(){return side('trip',`<div class="head"><div><h1>Viaje GEN-2407</h1><p class="muted">Última actualización: ${s.updated}</p></div>${pill()}</div><div class="grid"><section class="card"><div class="ch"><h3>Datos de la operación</h3><button class="btn secondary" onclick="go('driver')">Ver como conductor →</button></div><div class="cb"><div class="fields"><div class="f"><small>Cliente</small>Cerámica Mercedes</div><div class="f"><small>Conductor</small>Martín Ferreira</div><div class="f"><small>Origen</small>Mercedes — Fábrica ruta 2 km 275</div><div class="f"><small>Destino</small>Montevideo — Corralón Cerro</div><div class="f"><small>Vehículo</small>Volvo FH 460 · SBA 4127</div><div class="f"><small>Horarios</small>09:30 → 16:00</div><div class="f"><small>Carga</small>Cerámicas en pallets</div><div class="f"><small>Peso</small>7.200 kg</div></div></div></section><section class="card"><div class="ch"><h3>Trazabilidad</h3></div><div class="cb">${ev()}</div></section></div>`)}function history(){return side('history',`<div class="head"><div><h1>Historial GEN-2407</h1><p class="muted">Cada acción queda registrada.</p></div>${pill()}</div><div class="grid"><section class="card"><div class="ch"><h3>Actividad</h3></div><div class="cb">${ev()}</div></section><section class="card"><div class="ch"><h3>Operación conectada</h3></div><div class="cb"><div class="flow"><span>SOL-0235</span>→<span>GEN-2407</span>→<span>Martín Ferreira</span>→<span>SBA 4127</span></div><div class="ok">✓ Lo que cambia el conductor también cambia lo que consulta el cliente.</div></div></section></div>`)}function driver(){let i=order.indexOf(s.status),next=order[Math.min(i+1,5)],done=i===5;return top()+`<div class="phonewrap"><div class="phone"><div class="ph"><b>Hola, Martín</b><div class="muted" style="font-size:12px">Tu operación asignada</div></div><div class="pb"><section class="trip"><b>GEN-2407</b><span style="float:right;color:#94a3b8">SBA 4127</span><div class="route">Mercedes — Fábrica ruta 2 km 275<br>↓<br>Montevideo — Corralón Cerro</div><div class="progress">${order.map((x,j)=>`<i class="seg ${j<=i?'on':''}"></i>`).join('')}</div></section><section class="next"><h3>${done?'Operación completada':'Próxima acción: '+labels[next]}</h3><p>${done?'La entrega ya está visible en toda la operación.':'Al confirmar, el estado queda regi a.'][j]}</p></div><small>${j===i?s.updated:''}</small></div>`).join('')}</div></div></section><div class="actions"><button class="btn secondary" onclick="go('history')">Volver a administración</button><button class="btn secondary" onclick="go('driver')">Ver conductor</button></div></main>`}function advance(){let i=order.indexOf(s.status);if(i<5){s.status=order[i+1];s.updated=now();s.events.unshift([s.updated,'Estado actualizado: '+labels[s.status],'Martín Ferreira actualizó GEN-2407 desde el celular.']);save();toast('Estado actualizado');render()}}function doc(f){if(!f)return;s.docs.unshift(f.name);s.updated=now();s.events.unshift([s.updated,'Documento recibido y verificado',f.name+' quedó asociado a GEN-2407.']);save();toast('Documento asociado a GEN-2407');render()}function reset(){s=seed();save();toast('Demo reiniciada');render()}function track(){toast((document.getElementById('code').value||'').toUpperCase()==='GEN-2407'?'Operación encontrada':'Usá GEN-2407 en esta demo')}function render(){r=location.hash.slice(1)||'home';document.getElementById('app').innerHTML=({home,admin,trip,history,driver,client}[r]||home)()}window.addEventListener('hashchange',render);render();</script></body></html>
